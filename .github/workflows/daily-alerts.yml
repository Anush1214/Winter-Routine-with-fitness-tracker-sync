name: Winter Arc Daily Push Alerts

on:
  schedule:
    # 07:00 AM IST (01:30 UTC) - Morning Briefing
    - cron: '30 1 * * *'
    # 06:30 PM IST (13:00 UTC) - Evening DSA & Placement Prep Shift
    - cron: '0 13 * * *'
    # 10:30 PM IST (17:00 UTC) - Nightly Wrap-up & Sleep 11 PM Prep
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Notification slot to trigger (morning / evening / night / custom)'
        required: true
        default: 'morning'

jobs:
  dispatch-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Slot & Dispatch Alert
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || secrets.VERCEL_URL || 'https://your-winter-arc-app.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          HOUR=$(date -u +%H)
          SLOT="morning"
          
          if [ "${{ github.event.inputs.slot }}" != "" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          elif [ "$HOUR" -ge 16 ]; then
            SLOT="night"
          elif [ "$HOUR" -ge 12 ]; then
            SLOT="evening"
          else
            SLOT="morning"
          fi
          
          echo "Triggering Winter Arc push alert for slot: $SLOT"
          
          ENDPOINT="${APP_URL%/}/api/notifications/trigger?slot=$SLOT"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Response Status: $HTTP_STATUS"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to dispatch alert"
            exit 1
          fi
