name: winter_arc_mobile
description: "Solo Leveling System Protocol - 4-Month Winter Arc Mobile Application with Smartwatch Sync and Animated Holographic UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Backend & Real-time Database
  supabase_flutter: ^2.5.6
  
  # State Management
  provider: ^6.1.2
  
  # Cinematic Animations & Visual FX
  flutter_animate: ^4.5.0
  
  # Typography & Icons
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  
  # Audio Synthesizer & Sound Effects
  audioplayers: ^6.0.0
  
  # Haptics & Vibration
  vibration: ^2.0.1
  
  # Smartwatch & Health Ingestion (Apple Health & Health Connect)
  health: ^11.0.0
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
