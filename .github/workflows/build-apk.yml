name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get
          dart run flutter_launcher_icons

      - name: Generate Permanent Signing Keystore
        run: |
          mkdir -p mobile/android/app
          if [ ! -f mobile/android/app/upload-keystore.jks ]; then
            keytool -genkey -v -keystore mobile/android/app/upload-keystore.jks -storepass androiddebug -alias upload -keypass androiddebug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Winter Arc Hunter,O=Solo Leveling,C=US"
          fi
          echo "=== SHA-1 FINGERPRINT ==="
          keytool -list -v -keystore mobile/android/app/upload-keystore.jks -alias upload -storepass androiddebug -keypass androiddebug | grep "SHA1:" || true
          SHA1_VAL=$(keytool -list -v -keystore mobile/android/app/upload-keystore.jks -alias upload -storepass androiddebug -keypass androiddebug | grep "SHA1:" | awk '{print $2}')
          SHA256_VAL=$(keytool -list -v -keystore mobile/android/app/upload-keystore.jks -alias upload -storepass androiddebug -keypass androiddebug | grep "SHA256:" | awk '{print $2}')
          echo "SHA1_VAL=$SHA1_VAL" >> $GITHUB_ENV
          echo "SHA256_VAL=$SHA256_VAL" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winter-Arc-Solo-Leveling-App
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete existing latest release
        if: github.ref == 'refs/heads/main'
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Solo Leveling Winter Arc Protocol — Build #${{ github.run_number }}"
          body: |
            ## ❄️ Solo Leveling Winter Arc Mobile APK
            
            **Build #${{ github.run_number }}** — `${{ github.sha }}`
            
            Direct Download for Android Phone:
            - **Filename:** `app-release.apk`
            - **APK SHA-1 Signing Fingerprint:** `${{ env.SHA1_VAL }}`
            - **Features:** Strict Firebase Auth (Google OAuth, GitHub, Email/Password), Profile Avatar Customization with Solo Leveling Presets & Uploads, Habit Counters & Smartwatch Sync, Native Offline Alarms.
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
