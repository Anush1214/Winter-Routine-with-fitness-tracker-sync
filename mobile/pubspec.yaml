name: winter_arc_mobile
description: "Solo Leveling System Protocol - 4-Month Winter Arc Mobile Application with Smartwatch Sync and Animated Holographic UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Multi-User Authentication, Social Providers & Firestore Database
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  
  # Native Local On-Device Push Notifications & Alarms
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  
  # Backend & Real-time Database
  supabase_flutter: ^2.5.6
  
  # State Management
  provider: ^6.1.2
  
  # Cinematic Animations & Visual FX
  flutter_animate: ^4.5.0
  
  # Typography & Icons
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  
  # Smartwatch & Health Ingestion (Apple Health, Health Connect, Nothing X)
  health: ^11.0.0
  
  # Image Picker for Custom Profile Avatars
  image_picker: ^1.1.2
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#02050E"
  adaptive_icon_foreground: "assets/app_logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/audio/
    - assets/app_logo.jpg
    - assets/arise_scene.jpg

