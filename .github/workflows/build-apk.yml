name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winter-Arc-Solo-Leveling-App
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete existing latest release
        if: github.ref == 'refs/heads/main'
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Solo Leveling Winter Arc Protocol — Build #${{ github.run_number }}"
          body: |
            ## ❄️ Solo Leveling Winter Arc Mobile APK
            
            **Build #${{ github.run_number }}** — `${{ github.sha }}`
            
            Direct Download for Android Phone:
            - **Filename:** `app-release.apk`
            - **Includes:** Solo Leveling Holographic UI, Firebase Multi-User Auth (Google/GitHub/Email), Smartwatch Health Auto-Sync, Nothing X Integration, and Built-In Offline Native Alarms & Push Notifications.
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
