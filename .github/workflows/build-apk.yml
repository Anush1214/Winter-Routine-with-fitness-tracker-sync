name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get
          dart run flutter_launcher_icons

      - name: Ensure Stable Signing Keystore
        run: |
          KEYSTORE_PATH="mobile/android/app/upload-keystore.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo ">>> Generating NEW permanent keystore (first time only)..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass winterarc2026 \
              -alias upload \
              -keypass winterarc2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Winter Arc Hunter,O=Solo Leveling,C=US"
            
            # Commit the keystore back to the repo so future builds reuse it
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Force-add even though .gitignore has **/*.jks
            git add -f "$KEYSTORE_PATH"
            git commit -m "chore: add permanent signing keystore for stable SHA-1 fingerprints [skip ci]"
            git push
            echo ">>> Keystore committed to repo — future builds will reuse it."
          else
            echo ">>> Existing keystore found — reusing for consistent SHA-1."
          fi

          # Extract and display SHA fingerprints
          echo "=== APK SIGNING FINGERPRINTS ==="
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias upload \
            -storepass winterarc2026 -keypass winterarc2026 | grep -E "SHA1:|SHA256:"

          SHA1_VAL=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias upload \
            -storepass winterarc2026 -keypass winterarc2026 | grep "SHA1:" | awk '{print $2}')
          SHA256_VAL=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias upload \
            -storepass winterarc2026 -keypass winterarc2026 | grep "SHA256:" | awk '{print $2}')
          echo "SHA1_VAL=$SHA1_VAL" >> $GITHUB_ENV
          echo "SHA256_VAL=$SHA256_VAL" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winter-Arc-Solo-Leveling-App
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete existing latest release
        if: github.ref == 'refs/heads/main'
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Solo Leveling Winter Arc Protocol — Build #${{ github.run_number }}"
          body: |
            ## ❄️ Solo Leveling Winter Arc Mobile APK
            
            **Build #${{ github.run_number }}** — `${{ github.sha }}`
            
            ### 🔑 APK Signing Fingerprints
            > **Register these in Firebase Console → Project Settings → Android App → Add fingerprint**
            
            - **SHA-1:** `${{ env.SHA1_VAL }}`
            - **SHA-256:** `${{ env.SHA256_VAL }}`
            
            ### ✨ Features
            Strict Firebase Auth (Google OAuth, GitHub, Email/Password), Profile Avatar Customization with Solo Leveling Presets & Uploads, Habit Counters & Smartwatch Sync, Native Offline Alarms.
            
            ### ⚠️ First-Time Setup
            1. Copy the SHA-1 above
            2. Go to [Firebase Console](https://console.firebase.google.com/project/winter-arc-protocol/settings/general)
            3. Under **Your apps → Android**, click **Add fingerprint**
            4. Paste the SHA-1 and save
            5. Download the updated `google-services.json` and replace it in the repo
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
